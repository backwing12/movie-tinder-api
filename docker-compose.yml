services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:sqlserver://db:1433;databaseName=movietinder;encrypt=true;trustServerCertificate=true"
      DB_PASSWORD: ${DB_PASSWORD}
      TMDB_API_KEY: ${TMDB_API_KEY}
    depends_on:
      - db

volumes:
  mssql-data: