name: CI

# When the workflow runs: on every push to main, and on pull requests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # A fresh Linux machine from GitHub for each run
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch the code from the repo
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Install Java 21 (same version as jvmToolchain in build.gradle.kts)
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 3. Set up Gradle with caching, so later runs are faster
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 4. Build the project and run all tests
      - name: Build and test
        run: ./gradlew build