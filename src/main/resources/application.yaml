ktor:
  deployment:
    port: 8080
  application:
    modules:
      - dev.backwing.SerializationKt.configureSerialization
      - dev.backwing.RoutingKt.configureRouting
tmdb:
  apiKey: "$TMDB_API_KEY:"

database:
  url: "$DB_URL:jdbc:sqlserver://localhost:1433;databaseName=movietinder;encrypt=true;trustServerCertificate=true"
  user: "sa"
  password: "$DB_PASSWORD:"

cache:
  ttlHours: "$CACHE_TTL_HOURS:24"